{% extends "LAB1_hobby/base.html" %}
{% load static %}

{% block content %}
    <h2>Moja Galeria</h2>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        {% for photo in photos %}
            <div style="text-align: center;">
                <!-- Tutaj kluczowy jest prefiks static -->
                <img src="{% static 'LAB1_hobby/images/'|add:photo.filename %}" alt="{{ photo.title }}" style="width: 200px; height: 150px; object-fit: cover; border-radius: 4px;">
                <p>{{ photo.title }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
